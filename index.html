<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ayla &amp; Kameel's Super Obstacle Course</title>
<meta name="description" content="A fun platformer starring Ayla and Kameel!">
<meta name="theme-color" content="#1b1b2f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obstacle Course">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b2f; overflow: hidden; overscroll-behavior: none;
               touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
         font-family: 'Fredoka', system-ui, sans-serif; }
  body.portrait { align-items: flex-start; padding-top: calc(40px + env(safe-area-inset-top)); }
  canvas { display: block; background: #6ec6ff; }
  #touch { position: fixed; top: 0; bottom: env(safe-area-inset-bottom); left: env(safe-area-inset-left);
           right: env(safe-area-inset-right); pointer-events: none; }
  .tb { position: absolute; border-radius: 50%; box-sizing: border-box;
        background: rgba(255,255,255,.22); border: 3px solid rgba(255,255,255,.65); color: #fff;
        font-weight: 700; display: flex; align-items: center; justify-content: center;
        text-shadow: 0 2px 4px rgba(0,0,0,.4); transition: transform .05s; }
  .tb.down { background: rgba(255,255,255,.6); transform: scale(.92); }
  .tb.jump { background: rgba(255,110,170,.4); }
  .tb.swap { background: rgba(255,200,60,.4); }
  .tb.p1 { border-color: #ff6fa8; } .tb.p2 { border-color: #4fb3ff; }
  #btns { position: fixed; top: calc(6px + env(safe-area-inset-top)); right: calc(8px + env(safe-area-inset-right));
          display: flex; gap: 6px; z-index: 5; }
  #btns button { font: 700 13px 'Fredoka', sans-serif; border: 0; border-radius: 8px; min-width: 34px; height: 28px;
                 background: rgba(0,0,0,.4); color: #fff; cursor: pointer; padding: 0 8px; touch-action: manipulation; }
</style>
</head>
<body>
<canvas id="game" width="960" height="544"></canvas>
<div id="touch"></div>
<div id="btns">
  <button id="mute" title="Sound (M)">🔊</button>
  <button id="pause" title="Pause (P)">❚❚</button>
  <button id="fs" title="Full screen">⛶</button>
</div>
<script src="game.js"></script>
</body>
</html>
