<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ayla &amp; Kameel's Super Obstacle Course</title>
<meta name="description" content="A fun platformer starring Ayla and Kameel!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #1b1b2f; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', system-ui, sans-serif; }
  #wrap { position: relative; }
  canvas { display: block; background: #6ec6ff; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.5); image-rendering: auto; }
  #touch { position: absolute; inset: 0; pointer-events: none; display: none; }
  #touch.on { display: block; }
  .tb { position: absolute; bottom: 14px; width: 74px; height: 74px; border-radius: 50%;
        background: rgba(255,255,255,.28); border: 3px solid rgba(255,255,255,.6); color: #fff;
        font: 700 30px 'Fredoka', sans-serif; display: flex; align-items: center; justify-content: center;
        pointer-events: auto; user-select: none; -webkit-user-select: none; }
  .tb.down { background: rgba(255,255,255,.55); }
  #tl { left: 14px; } #tr { left: 100px; } #tj { right: 14px; width: 90px; height: 90px; }
  #btns { position: absolute; top: 8px; right: 10px; display: flex; gap: 6px; }
  #rot { display: none; position: fixed; inset: 0; background: #2a1a5a; color: #fff; font: 700 24px 'Fredoka', sans-serif;
         align-items: center; justify-content: center; text-align: center; padding: 30px; z-index: 9; }
  @media (orientation: portrait) and (max-width: 700px) { #rot { display: flex; } }
  #btns button { font: 700 14px 'Fredoka', sans-serif; border: 0; border-radius: 8px; padding: 6px 10px;
                 background: rgba(0,0,0,.35); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="544"></canvas>
  <div id="btns"><button id="mute" title="Sound (M)">🔊</button><button id="pause" title="Pause (P)">❚❚</button></div>
  <div id="touch">
    <div class="tb" id="tl">◀</div>
    <div class="tb" id="tr">▶</div>
    <div class="tb" id="tj">⤒</div>
  </div>
</div>
<div id="rot">📱↻<br>Turn your phone sideways to play!</div>
<script src="game.js"></script>
</body>
</html>
